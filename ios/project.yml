name: Atlas
options:
  bundleIdPrefix: com.atlasclinic
targets:
  Atlas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasclinic.app
        PRODUCT_NAME: Atlas
        SWIFT_VERSION: 6.0
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: Atlas/Atlas.entitlements
    info:
      path: Atlas/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - atlas
