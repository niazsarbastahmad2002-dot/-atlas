name: Atlas Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ATLAS_PRODUCTION_URL: https://atlasclinic.dpdns.org
      ATLAS_EXPECTED_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for exact Vercel production commit
        run: node scripts/wait-for-production.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install production smoke browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify live Atlas on WebKit and Chromium
        run: npx playwright test --config=playwright.production.config.mjs
