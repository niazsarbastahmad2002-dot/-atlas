name: Dependency security repair

on:
  push:
    branches:
      - security/update-next-sharp-2026-09-23

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update vulnerable production dependencies
        run: |
          npm install next@16.3.6 --save-exact

      - name: Verify dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Atlas verification
        run: npm run check

      - name: Commit repaired dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Fix production dependency vulnerabilities"
          git push
