name: Sorani ASR ONNX feasibility

on:
  push:
    branches:
      - research/sorani-asr-onnx
    paths:
      - .github/workflows/sorani-asr-onnx.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'optimum[onnxruntime]' transformers datasets soundfile jiwer onnx onnxruntime

      - name: Export Sorani Whisper to ONNX
        run: |
          optimum-cli export onnx \
            --model razhan/whisper-base-ckb \
            --task automatic-speech-recognition-with-past \
            exported

      - name: Quantize browser candidates and inspect sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          from onnxruntime.quantization import quantize_dynamic, QuantType
          import onnx
          
          root = Path('exported')
          out = Path('browser-model')
          out.mkdir(exist_ok=True)
          for name in ['encoder_model.onnx', 'decoder_model_merged.onnx']:
              source = root / name
              if not source.exists():
                  raise SystemExit(f'Missing expected ONNX file: {source}')
              target = out / name.replace('.onnx', '_int8.onnx')
              quantize_dynamic(str(source), str(target), weight_type=QuantType.QInt8, per_channel=False)
              onnx.checker.check_model(str(target))
          
          keep = [
              'config.json', 'generation_config.json', 'preprocessor_config.json',
              'tokenizer.json', 'tokenizer_config.json', 'special_tokens_map.json',
              'vocab.json', 'merges.txt', 'added_tokens.json', 'normalizer.json'
          ]
          for name in keep:
              source = root / name
              if source.exists():
                  (out / name).write_bytes(source.read_bytes())
          
          lines = []
          for file in sorted(out.rglob('*')):
              if file.is_file():
                  mb = file.stat().st_size / (1024 * 1024)
                  lines.append(f'{file.relative_to(out)}\t{mb:.2f} MiB')
          report = '\n'.join(lines)
          Path('sorani-onnx-sizes.txt').write_text(report + '\n', encoding='utf-8')
          print(report)
          PY

      - name: Validate exported ONNX on a real Sorani sample
        run: |
          python - <<'PY'
          from datasets import load_dataset
          from transformers import AutoProcessor
          from optimum.onnxruntime import ORTModelForSpeechSeq2Seq
          from jiwer import wer
          import json
          
          ds = load_dataset('razhan/common_voice_ckb_16', split='test', streaming=True)
          row = next(iter(ds))
          audio = row['audio']
          reference = row.get('sentence') or row.get('text') or row.get('transcription') or ''
          processor = AutoProcessor.from_pretrained('exported')
          model = ORTModelForSpeechSeq2Seq.from_pretrained('exported', provider='CPUExecutionProvider')
          inputs = processor(audio['array'], sampling_rate=audio['sampling_rate'], return_tensors='pt')
          generated = model.generate(**inputs, max_new_tokens=128)
          transcript = processor.batch_decode(generated, skip_special_tokens=True)[0].strip()
          result = {
              'reference': reference,
              'transcript': transcript,
              'wer': wer(reference, transcript) if reference else None,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open('sorani-onnx-sample.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          if not transcript:
              raise SystemExit('ONNX model produced an empty Sorani transcript')
          PY

      - name: Upload feasibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorani-asr-onnx-feasibility
          path: |
            browser-model/
            sorani-onnx-sizes.txt
            sorani-onnx-sample.json
          retention-days: 3
