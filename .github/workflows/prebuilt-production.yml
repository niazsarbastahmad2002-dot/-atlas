name: Atlas prebuilt production deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: atlas-prebuilt-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_12LjTXJIxUILoIdh54kXsRUc
      VERCEL_PROJECT_ID: prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Atlas
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Report deployment start
        run: |
          gh issue comment 59 --body "Prebuilt production deployment started for commit $GITHUB_SHA."

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci

      - name: Install Vercel CLI
        id: cli
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: npm install --global vercel@latest

      - name: Check Vercel token availability
        id: tokencheck
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"

      - name: Pull production settings and environment
        id: pull
        if: steps.tokencheck.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          OUTPUT=$(vercel pull --yes --environment=production --scope=atlas-fca2 --token="$VERCEL_TOKEN" 2>&1)
          STATUS=$?
          export OUTPUT STATUS VERCEL_TOKEN
          python - <<'PY' > /tmp/vercel-pull-diagnostic.txt
          import os
          text = os.environ.get("OUTPUT", "")
          token = os.environ.get("VERCEL_TOKEN", "")
          if token:
              text = text.replace(token, "[REDACTED]")
          text = text[-1800:]
          print(f"vercel pull exit code: {os.environ.get('STATUS', '?')}\n\n{text}")
          PY
          gh issue comment 59 --body-file /tmp/vercel-pull-diagnostic.txt
          exit "$STATUS"

      - name: Build Atlas on GitHub Actions
        id: build
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: vercel build --prod --scope=atlas-fca2 --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt Atlas to production
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: vercel deploy --prebuilt --prod --scope=atlas-fca2 --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Report deployment diagnostics
        if: always()
        run: |
          gh issue comment 59 --body "Deployment step outcomes for $GITHUB_SHA — npm ci: ${{ steps.deps.outcome }}; Vercel CLI: ${{ steps.cli.outcome }}; token available: ${{ steps.tokencheck.outcome }}; vercel pull: ${{ steps.pull.outcome }}; vercel build: ${{ steps.build.outcome }}; prebuilt deploy: ${{ steps.deploy.outcome }}."

      - name: Fail if deployment did not succeed
        if: always() && steps.deploy.outcome != 'success'
        run: exit 1
