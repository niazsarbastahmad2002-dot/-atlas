name: Atlas prebuilt production deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: atlas-prebuilt-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Atlas
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Report deployment start
        run: |
          gh issue comment 59 --body "Prebuilt production deployment started for commit $GITHUB_SHA."

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci

      - name: Install Vercel CLI
        id: cli
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: npm install --global vercel@latest

      - name: Pull production settings and environment
        id: pull
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Atlas on GitHub Actions
        id: build
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt Atlas to production
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Report deployment diagnostics
        if: always()
        run: |
          gh issue comment 59 --body "Deployment step outcomes for $GITHUB_SHA — npm ci: ${{ steps.deps.outcome }}; Vercel CLI: ${{ steps.cli.outcome }}; vercel pull: ${{ steps.pull.outcome }}; vercel build: ${{ steps.build.outcome }}; prebuilt deploy: ${{ steps.deploy.outcome }}."

      - name: Fail if deployment did not succeed
        if: always() && steps.deploy.outcome != 'success'
        run: exit 1
