name: Atlas prebuilt production deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: atlas-prebuilt-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Atlas
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Report deployment start
        run: gh issue comment 59 --body "Prebuilt production deployment started for commit $GITHUB_SHA."

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings and environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Atlas on GitHub Actions
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt Atlas to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Report deployment result
        if: always()
        run: gh issue comment 59 --body "Prebuilt production deployment finished with status: ${{ job.status }} for commit $GITHUB_SHA."
