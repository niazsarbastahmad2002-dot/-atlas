name: Recover Atlas source

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Test current Vercel file API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_ID: dpl_CmQfdFrTFCZJCE5GrhdjjdkXactR
          FILE_ID: 1043867a536c617de96b67751532e7f88aef2999
        run: |
          set -euo pipefail

          STATUS=$(curl -sS \
            -o response.bin \
            -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v8/deployments/$DEPLOYMENT_ID/files/$FILE_ID?teamId=$VERCEL_ORG_ID")

          echo "HTTP status: $STATUS"
          echo "Response bytes: $(wc -c < response.bin)"

          if [ "$STATUS" != "200" ]; then
            cat response.bin
            exit 1
          fi

          python3 <<'PY'
          import json
          import base64
          from pathlib import Path

          raw = Path("response.bin").read_bytes()

          try:
              data = json.loads(raw)
              print("Response is JSON")

              if isinstance(data, dict):
                  print("Response keys:", sorted(data.keys()))

                  if isinstance(data.get("content"), str):
                      decoded = base64.b64decode(data["content"])
                      print("Decoded file bytes:", len(decoded))
                      print("File content successfully retrieved.")
                  else:
                      print("No content field found; inspect response shape.")
              else:
                  print("JSON type:", type(data).__name__)

          except Exception:
              print("Response is raw file data.")
              print("File content successfully retrieved.")
          PY
