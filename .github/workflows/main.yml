name: Recover Atlas source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create safe recovery branch
        run: |
          BRANCH="recovered-atlas-source-${GITHUB_RUN_ID}"
          echo "RECOVERY_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

      - name: Recover original Atlas source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_ID: dpl_CmQfdFrTFCZJCE5GrhdjjdkXactR
        run: |
          set -euo pipefail

          python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import shutil
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_ORG_ID"]
          deployment = os.environ["DEPLOYMENT_ID"]

          headers = {"Authorization": f"Bearer {token}"}

          list_url = (
              f"https://api.vercel.com/v6/deployments/"
              f"{deployment}/files?teamId={team}"
          )

          req = urllib.request.Request(list_url, headers=headers)
          with urllib.request.urlopen(req) as response:
              tree = json.load(response)

          source = next(
              (
                  item for item in tree
                  if item.get("name") == "src"
                  and item.get("type") == "directory"
              ),
              None,
          )

          if source is None:
              raise SystemExit("Original src tree was not found.")

          recovery = pathlib.Path("_atlas_recovered")

          if recovery.exists():
              shutil.rmtree(recovery)

          recovery.mkdir()

          recovered = 0
          skipped = []

          def safe_target(prefix, name):
              part = pathlib.PurePosixPath(name)

              if part.is_absolute() or ".." in part.parts:
                  raise RuntimeError(f"Unsafe path: {name}")

              return prefix.joinpath(*part.parts)

          def try_base64(value):
              if not isinstance(value, str):
                  return None

              try:
                  return base64.b64decode(value, validate=True)
              except Exception:
                  try:
                      return base64.b64decode(value)
                  except Exception:
                      return None

          def extract_file(obj):
              if isinstance(obj, bytes):
                  return obj

              if isinstance(obj, str):
                  decoded = try_base64(obj)
                  return decoded if decoded is not None else obj.encode()

              if isinstance(obj, list):
                  if all(
                      isinstance(x, int) and 0 <= x <= 255
                      for x in obj
                  ):
                      return bytes(obj)

              if isinstance(obj, dict):
                  # Node-style Buffer JSON
                  if (
                      obj.get("type") == "Buffer"
                      and isinstance(obj.get("data"), list)
                  ):
                      return bytes(obj["data"])

                  # Common response field names
                  for key in (
                      "content",
                      "contents",
                      "data",
                      "body",
                      "file",
                      "value",
                  ):
                      if key in obj:
                          try:
                              return extract_file(obj[key])
                          except Exception:
                              pass

                  # Search nested objects as a fallback
                  for value in obj.values():
                      if isinstance(value, (dict, list)):
                          try:
                              return extract_file(value)
                          except Exception:
                              pass

              raise RuntimeError(
                  "Could not decode Vercel file response."
              )

          def download(uid):
              url = (
                  f"https://api.vercel.com/v8/deployments/"
                  f"{deployment}/files/"
                  f"{urllib.parse.quote(uid, safe='')}"
                  f"?teamId={team}"
              )

              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  raw = response.read()

              try:
                  obj = json.loads(raw)
                  return extract_file(obj)
              except json.JSONDecodeError:
                  return raw

          def walk(items, prefix):
              global recovered

              for item in items:
                  name = item["name"]
                  typ = item["type"]

                  # Never recover secrets into GitHub.
                  if name.startswith(".env") and name != ".env.example":
                      skipped.append(str(prefix / name))
                      continue

                  target = safe_target(prefix, name)

                  if typ == "directory":
                      target.mkdir(parents=True, exist_ok=True)
                      walk(item.get("children", []), target)
                      continue

                  if typ != "file":
                      continue

                  content = download(item["uid"])

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)

                  recovered += 1
                  print(f"Recovered: {target}")

          walk(source.get("children", []), recovery)

          required = [
              recovery / "package.json",
              recovery / "app",
              recovery / "lib",
          ]

          missing = [str(p) for p in required if not p.exists()]

          if missing:
              raise SystemExit(
                  "Recovery incomplete: " + ", ".join(missing)
              )

          # Verify package.json is actually valid source, not an API wrapper.
          with open(recovery / "package.json", "r") as f:
              json.load(f)

          print(f"Recovered {recovered} files successfully.")

          print("Skipped secret files:")
          for item in skipped:
              print(item)
          PY

      - name: Copy recovered project into branch
        run: |
          set -euo pipefail

          cp -a _atlas_recovered/. .
          rm -rf _atlas_recovered

          test -f package.json
          test -d app
          test -d lib

          echo "Atlas source validated."

      - name: Commit recovered source
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git reset -- .github/workflows/main.yml

          if git diff --cached --quiet; then
            echo "No source files recovered."
            exit 1
          fi

          git commit -m "Recover Atlas source from Vercel"
          git push origin "$RECOVERY_BRANCH"

          echo "Recovery branch: $RECOVERY_BRANCH"
