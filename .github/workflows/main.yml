name: Recover Atlas source

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Test old Atlas deployment files
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_ID: dpl_CmQfdFrTFCZJCE5GrhdjjdkXactR
        run: |
          set -euo pipefail

          STATUS=$(curl -sS \
            -o files.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files?teamId=$VERCEL_ORG_ID")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            cat files.json
            exit 1
          fi

          python -m json.tool files.json
