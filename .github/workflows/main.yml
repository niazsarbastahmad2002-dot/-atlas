name: Recover Atlas source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create safe recovery branch
        run: |
          BRANCH="recovered-atlas-source-${GITHUB_RUN_ID}"
          echo "RECOVERY_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

      - name: Recover original Atlas source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_ID: dpl_CmQfdFrTFCZJCE5GrhdjjdkXactR
        run: |
          set -euo pipefail

          python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import shutil
          import urllib.request
          import urllib.parse

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_ORG_ID"]
          deployment = os.environ["DEPLOYMENT_ID"]

          headers = {"Authorization": f"Bearer {token}"}

          list_url = (
              f"https://api.vercel.com/v6/deployments/"
              f"{deployment}/files?teamId={team}"
          )

          req = urllib.request.Request(list_url, headers=headers)
          with urllib.request.urlopen(req) as response:
              tree = json.load(response)

          source = next(
              (
                  item for item in tree
                  if item.get("name") == "src"
                  and item.get("type") == "directory"
              ),
              None,
          )

          if source is None:
              raise SystemExit("Original src tree was not found.")

          recovery = pathlib.Path("_atlas_recovered")
          if recovery.exists():
              shutil.rmtree(recovery)
          recovery.mkdir()

          recovered = 0
          skipped = []

          def safe_target(prefix, name):
              part = pathlib.PurePosixPath(name)

              if part.is_absolute() or ".." in part.parts:
                  raise RuntimeError(f"Unsafe deployment path: {name}")

              return prefix.joinpath(*part.parts)

          def decode_response(raw):
              try:
                  obj = json.loads(raw)
              except Exception:
                  return raw

              if isinstance(obj, dict) and isinstance(obj.get("content"), str):
                  return base64.b64decode(obj["content"])

              if isinstance(obj, str):
                  try:
                      return base64.b64decode(obj)
                  except Exception:
                      return obj.encode()

              raise RuntimeError(
                  f"Unexpected Vercel file response: {type(obj).__name__}"
              )

          def walk(items, prefix):
              global recovered

              for item in items:
                  name = item["name"]
                  typ = item["type"]

                  # Never put deployment secrets into GitHub.
                  if name.startswith(".env") and name != ".env.example":
                      skipped.append(str(prefix / name))
                      continue

                  target = safe_target(prefix, name)

                  if typ == "directory":
                      target.mkdir(parents=True, exist_ok=True)
                      walk(item.get("children", []), target)
                      continue

                  if typ != "file":
                      continue

                  uid = item["uid"]

                  url = (
                      f"https://api.vercel.com/v8/deployments/"
                      f"{deployment}/files/"
                      f"{urllib.parse.quote(uid, safe='')}"
                      f"?teamId={team}"
                  )

                  request = urllib.request.Request(url, headers=headers)

                  with urllib.request.urlopen(request) as response:
                      raw = response.read()

                  content = decode_response(raw)

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)

                  recovered += 1
                  print(f"Recovered: {target}")

          walk(source.get("children", []), recovery)

          required = [
              recovery / "package.json",
              recovery / "app",
              recovery / "lib",
          ]

          missing = [str(p) for p in required if not p.exists()]

          if missing:
              raise SystemExit(
                  "Recovery incomplete. Missing: " + ", ".join(missing)
              )

          print(f"Recovered {recovered} source files.")
          print("Skipped secret environment files:")
          for item in skipped:
              print(f"  {item}")
          PY

      - name: Copy recovered project into branch
        run: |
          set -euo pipefail

          cp -a _atlas_recovered/. .
          rm -rf _atlas_recovered

          echo "Recovered project files:"
          find app lib -type f | sort
          ls -la package.json

      - name: Commit recovered source
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Keep the recovery workflow itself from being part of
          # the recovered source commit.
          git reset -- .github/workflows/main.yml

          if git diff --cached --quiet; then
            echo "No source files were recovered."
            exit 1
          fi

          git commit -m "Recover Atlas source from Vercel"
          git push origin "$RECOVERY_BRANCH"

          echo "Recovery branch created: $RECOVERY_BRANCH"
