name: Atlas Patient Page 05 Review CI

on:
  push:
    branches:
      - patient/page05-suggested-specialties-oct14

permissions:
  contents: read

jobs:
  page05-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, tests and production-build validation only
        run: npm run check
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Install Chromium in isolated runner
        run: npx playwright install --with-deps chromium
      - name: Page 05 browser checks on phone, tablet and desktop viewports
        env:
          ATLAS_PATIENT_COMPLAINT_GUIDE_ENABLED: "true"
        run: npx playwright test e2e/patient-page05-specialties.spec.mjs
