name: Meta Embedded Signup diagnostic

on:
  push:
    branches: [diagnose-meta-onboarding-env]
    paths:
      - .github/workflows/meta-embedded-signup-diagnostic.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/meta-embedded-signup-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_PROJECT_ID: prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ
      VERCEL_ORG_ID: team_12LjTXJIxUILoIdh54kXsRUc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set safe known production values
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
            --data '{"key":"META_APP_ID","value":"1444517747585211","type":"encrypted","target":["production"],"comment":"Atlas Clinic Platform Meta app ID"}' \
            > /tmp/vercel-meta-app-id.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
            --data '{"key":"WHATSAPP_GRAPH_API_VERSION","value":"v26.0","type":"encrypted","target":["production"],"comment":"Current supported Meta Graph API version"}' \
            > /tmp/vercel-graph-version.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
            --data '{"key":"META_EMBEDDED_SIGNUP_ENABLED","value":"false","type":"encrypted","target":["production"],"comment":"Keep disabled until config ID and app secret are verified"}' \
            > /tmp/vercel-embedded-enabled.json

      - name: Verify Vercel upsert responses
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          files = {
              "meta_app_id": "/tmp/vercel-meta-app-id.json",
              "graph_version": "/tmp/vercel-graph-version.json",
              "embedded_enabled": "/tmp/vercel-embedded-enabled.json",
          }

          def summarize(value):
              if isinstance(value, list):
                  return [summarize(item) for item in value]
              if not isinstance(value, dict):
                  return type(value).__name__
              safe = {}
              for key, item in value.items():
                  if key in {"value", "id", "createdAt", "updatedAt"}:
                      continue
                  if key in {"key", "type", "target", "gitBranch", "error", "code", "status", "failed"}:
                      safe[key] = summarize(item) if isinstance(item, (dict, list)) else item
              return safe

          for label, filename in files.items():
              data = json.load(open(filename))
              print(f"{label}: {json.dumps(summarize(data), sort_keys=True)}")
          PY

      - name: Fetch production environment securely
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&decrypt=true" \
            > /tmp/vercel-env.json

      - name: Evaluate Atlas readiness contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re

          raw = json.load(open("/tmp/vercel-env.json"))
          items = raw.get("envs", raw if isinstance(raw, list) else [])
          env = {}
          present_keys = set()
          for item in items:
              target = item.get("target") or []
              if isinstance(target, str):
                  target = [target]
              if target and "production" not in target:
                  continue
              key = item.get("key")
              value = item.get("value")
              if key:
                  present_keys.add(str(key))
              if key and value is not None:
                  env[key] = str(value)

          enabled = env.get("META_EMBEDDED_SIGNUP_ENABLED", "").strip().lower() == "true"
          app_id = env.get("META_APP_ID", "").strip()
          config_id = env.get("META_EMBEDDED_SIGNUP_CONFIG_ID", "").strip()
          graph_version = env.get("WHATSAPP_GRAPH_API_VERSION", "").strip()
          app_secret = env.get("WHATSAPP_APP_SECRET", "").strip()

          app_id_valid = bool(re.fullmatch(r"\d{5,32}", app_id))
          config_id_valid = bool(re.fullmatch(r"\d{5,64}", config_id))
          graph_version_valid = bool(re.fullmatch(r"v\d+\.\d+", graph_version))
          app_secret_present = len(app_secret) >= 16

          blockers = []
          if not enabled:
              blockers.append("embedded_signup_disabled")
          if not app_id_valid:
              blockers.append("meta_app_id_missing")
          if not config_id_valid:
              blockers.append("embedded_signup_config_missing")
          if not graph_version_valid:
              blockers.append("graph_api_version_missing")
          if not app_secret_present:
              blockers.append("meta_app_secret_missing")

          expected_app = app_id == "1444517747585211"
          lines = [
              "## Meta Embedded Signup production diagnostic",
              "",
              f"- Atlas readiness configured: **{'yes' if not blockers else 'no'}**",
              f"- Embedded Signup enabled: **{'yes' if enabled else 'no'}**",
              f"- Meta app ID key exists: **{'yes' if 'META_APP_ID' in present_keys else 'no'}**",
              f"- Meta app ID valid: **{'yes' if app_id_valid else 'no'}**",
              f"- Meta app ID matches Atlas: **{'yes' if expected_app else 'no'}**",
              f"- Embedded Signup configuration ID key exists: **{'yes' if 'META_EMBEDDED_SIGNUP_CONFIG_ID' in present_keys else 'no'}**",
              f"- Embedded Signup configuration ID valid: **{'yes' if config_id_valid else 'no'}**",
              f"- Graph API version key exists: **{'yes' if 'WHATSAPP_GRAPH_API_VERSION' in present_keys else 'no'}**",
              f"- Graph API version valid: **{'yes' if graph_version_valid else 'no'}**",
              f"- Meta app secret present: **{'yes' if app_secret_present else 'no'}**",
              f"- Exact blockers: **{', '.join(blockers) if blockers else 'none'}**",
              "",
              "No IDs, credentials, environment values, or patient data are printed.",
          ]
          open("/tmp/meta-embedded-report.md", "w").write("\n".join(lines) + "\n")
          print("Meta Embedded Signup diagnostic completed without printing secrets.")
          PY

      - name: Redeploy production with updated environment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$VERCEL_ORG_ID" \
            --data '{"deploymentId":"dpl_BJENsa3rBrCcG7F7DNDz7zWc7xdo","name":"atlas_demo_fixed","project":"prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ","target":"production"}' \
            > /tmp/vercel-redeploy.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/vercel-redeploy.json"))
          print("Production redeploy requested:", {
              "created": bool(data.get("id")),
              "status": data.get("status") or data.get("readyState"),
          })
          PY

      - name: Publish sanitized result
        if: always()
        run: |
          if [ -f /tmp/meta-embedded-report.md ]; then
            cat /tmp/meta-embedded-report.md
            cat /tmp/meta-embedded-report.md >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              gh pr comment "${{ github.event.pull_request.number }}" \
                --repo "niazsarbastahmad2002-dot/-atlas" \
                --body-file /tmp/meta-embedded-report.md
            fi
          fi
