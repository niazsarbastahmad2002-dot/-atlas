name: Atlas one-shot reminder language and navigation fix

on:
  push:
    branches:
      - atlas-reminder-language-navigation-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atlas-reminder-language-navigation-fix
          fetch-depth: 0
      - name: Apply product patch
        run: python3 scripts/atlas-one-shot-reminder-fix.py
      - name: Commit generated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/dashboard/schedule-navigation-polish.tsx \
            app/atlas-perfect.css \
            app/dashboard/actions.ts \
            app/dashboard/instant-actions.ts \
            app/dashboard/settings/actions.ts \
            app/api/settings/doctor-workflow/route.ts \
            app/dashboard/page.tsx \
            app/dashboard/appointment-editor.tsx \
            app/dashboard/settings-reminder-card.tsx \
            app/patient/'[token]'/page.tsx \
            lib/reminders/meta-template-bootstrap.ts \
            supabase/migrations/20260820033949_allow_badini_reminder_language.sql \
            tests/reminder-language-navigation.test.ts \
            scripts/atlas-one-shot-reminder-fix.py \
            .github/workflows/atlas-one-shot-reminder-fix.yml
          git diff --cached --check
          git commit -m "Fix schedule navigation and reminder languages"
          git push origin HEAD:atlas-reminder-language-navigation-fix
