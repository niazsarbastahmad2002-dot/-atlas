name: Atlas one-shot reminder row type fix
on:
  push:
    branches:
      - atlas-reminder-language-navigation-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-reminder-language-navigation-fix
          fetch-depth: 0
      - run: python3 scripts/atlas-one-shot-row-type-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/dashboard/page.tsx scripts/atlas-one-shot-row-type-fix.py .github/workflows/atlas-one-shot-row-type-fix.yml
          git diff --cached --check
          git commit -m "Type reminder language default rows"
          git push origin HEAD:atlas-reminder-language-navigation-fix
