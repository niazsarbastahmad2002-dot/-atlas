name: Secure Meta production probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/meta-secure-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_ORG_ID: team_12LjTXJIxUILoIdh54kXsRUc
      VERCEL_PROJECT_ID: prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probe production Meta state safely
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          probe_dir="$(mktemp -d)"
          trap 'rm -f "$env_file"; rm -rf "$probe_dir"' EXIT
          mkdir -p "$probe_dir/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > "$probe_dir/.vercel/project.json"

          if ! npx --yes vercel@latest env pull "$env_file" --cwd "$probe_dir" --environment=production --yes --token="$VERCEL_TOKEN" >/tmp/vercel-env-pull.log 2>&1; then
            reason="unknown"
            if grep -Eqi 'rate.?limit|too many requests' /tmp/vercel-env-pull.log; then reason="rate_limited"; fi
            if grep -Eqi 'unauthorized|invalid token|authentication' /tmp/vercel-env-pull.log; then reason="auth_failed"; fi
            if grep -Eqi 'project.*not found|not linked|scope' /tmp/vercel-env-pull.log; then reason="project_link_failed"; fi
            echo "ATLAS_META_SAFE_PROBE={\"vercelEnvPull\":false,\"reason\":\"$reason\"}"
            python - <<'PY'
            import os, re
            text = open("/tmp/vercel-env-pull.log", "r", errors="replace").read()
            token = os.environ.get("VERCEL_TOKEN", "")
            if token:
                text = text.replace(token, "[redacted]")
            text = re.sub(r"(?i)(authorization|bearer|token)([=: ]+)\\S+", r"\\1\\2[redacted]", text)
            lines = [line for line in text.splitlines() if line.strip()]
            print("VERCEL_CLI_DIAGNOSTIC_BEGIN")
            print("\n".join(lines[-20:]))
            print("VERCEL_CLI_DIAGNOSTIC_END")
            PY
            exit 1
          fi

          node --env-file="$env_file" <<'NODE'
          const graphVersion = process.env.WHATSAPP_GRAPH_API_VERSION || "v26.0";
          const appId = process.env.META_APP_ID || "1444517747585211";
          const businessId = "1058270820430553";
          const wabaId = "1553173296558731";
          const token =
            process.env.WHATSAPP_ACCESS_TOKEN ||
            process.env.META_ACCESS_TOKEN ||
            process.env.WHATSAPP_META_ACCESS_TOKEN ||
            "";

          const out = {
            vercelEnvPull: true,
            env: {
              metaAppId: Boolean(process.env.META_APP_ID),
              graphApiVersion: Boolean(process.env.WHATSAPP_GRAPH_API_VERSION),
              embeddedSignupEnabled: process.env.META_EMBEDDED_SIGNUP_ENABLED === "true",
              embeddedSignupConfigId: Boolean(process.env.META_EMBEDDED_SIGNUP_CONFIG_ID),
              appSecret: Boolean(process.env.WHATSAPP_APP_SECRET),
              accessToken: Boolean(token),
              provider: process.env.WHATSAPP_PROVIDER || null,
            },
            graphVersion,
          };

          function safeError(json, status) {
            return {
              ok: false,
              httpStatus: status,
              code: json && json.error ? json.error.code || null : null,
              subcode: json && json.error ? json.error.error_subcode || null : null,
              type: json && json.error ? json.error.type || null : null,
            };
          }

          async function graph(path, fields) {
            const url = new URL(
              "https://graph.facebook.com/" + graphVersion + "/" + path
            );
            if (fields) url.searchParams.set("fields", fields);
            url.searchParams.set("access_token", token);
            try {
              const response = await fetch(url, {
                signal: AbortSignal.timeout(15000),
              });
              const json = await response.json();
              if (!response.ok || json.error) return safeError(json, response.status);
              return { ok: true, data: json.data === undefined ? json : json.data };
            } catch {
              return { ok: false, httpStatus: null, code: "request_failed" };
            }
          }

          if (!token) {
            console.log("ATLAS_META_SAFE_PROBE=" + JSON.stringify(out));
            process.exit(0);
          }

          const [waba, phones, templates, subscriptions, ownedWabas, app, permissions] =
            await Promise.all([
              graph(wabaId, "id,name,currency,timezone_id"),
              graph(
                wabaId + "/phone_numbers",
                "id,display_phone_number,verified_name,quality_rating"
              ),
              graph(
                wabaId + "/message_templates",
                "id,name,language,status,category,rejected_reason"
              ),
              graph(wabaId + "/subscribed_apps", "id,name"),
              graph(
                businessId + "/owned_whatsapp_business_accounts",
                "id,name"
              ),
              graph(
                appId,
                "id,name,app_domains,privacy_policy_url,terms_of_service_url"
              ),
              graph("me/permissions", "permission,status"),
            ]);

          out.waba = waba.ok
            ? {
                ok: true,
                id: waba.data.id || null,
                name: waba.data.name || null,
              }
            : waba;

          if (phones.ok) {
            const phoneRows = Array.isArray(phones.data) ? phones.data : [];
            out.phones = phoneRows.map((row) => {
              const digits = String(row.display_phone_number || "").replace(/\D/g, "");
              let kind = "other";
              if (digits.startsWith("1555")) kind = "meta_test_555";
              if (digits.startsWith("964")) kind = "real_964";
              return {
                id: row.id || null,
                kind,
                verifiedName: row.verified_name || null,
                qualityRating: row.quality_rating || null,
              };
            });
            out.real964Count = out.phones.filter((row) => row.kind === "real_964").length;
          } else {
            out.phones = phones;
          }

          if (templates.ok) {
            const templateRows = Array.isArray(templates.data) ? templates.data : [];
            out.templates = templateRows
              .filter((row) =>
                row.language === "ar" ||
                row.language === "en_US" ||
                /atlas|appointment|reminder/i.test(String(row.name || ""))
              )
              .slice(0, 50)
              .map((row) => ({
                id: row.id || null,
                name: row.name || null,
                language: row.language || null,
                status: row.status || null,
                category: row.category || null,
                rejectedReason: row.rejected_reason || null,
              }));
          } else {
            out.templates = templates;
          }

          out.subscribedApps = subscriptions.ok
            ? (Array.isArray(subscriptions.data) ? subscriptions.data : []).map((row) => ({
                id: row.id || null,
                name: row.name || null,
              }))
            : subscriptions;

          out.ownedWabas = ownedWabas.ok
            ? (Array.isArray(ownedWabas.data) ? ownedWabas.data : []).map((row) => ({
                id: row.id || null,
                name: row.name || null,
              }))
            : ownedWabas;

          out.app = app.ok
            ? {
                ok: true,
                id: app.data.id || null,
                name: app.data.name || null,
                appDomains: app.data.app_domains || [],
                privacyPolicyUrl: app.data.privacy_policy_url || null,
                termsUrl: app.data.terms_of_service_url || null,
              }
            : app;

          out.permissions = permissions.ok
            ? (Array.isArray(permissions.data) ? permissions.data : []).map((row) => ({
                permission: row.permission || null,
                status: row.status || null,
              }))
            : permissions;

          console.log("ATLAS_META_SAFE_PROBE=" + JSON.stringify(out));
          NODE
