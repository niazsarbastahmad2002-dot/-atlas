name: Personal WhatsApp Preview

on:
  push:
    branches: [feat/chatgpt-personal-whatsapp]

permissions:
  contents: read

concurrency:
  group: atlas-personal-whatsapp-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_PROJECT_ID: prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ
      VERCEL_ORG_ID: team_12LjTXJIxUILoIdh54kXsRUc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout personal WhatsApp branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Atlas Vercel project locally
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_12LjTXJIxUILoIdh54kXsRUc","projectId":"prj_L7ubUUcpmzYETAYiK0dCJsqzU4bJ"}' > .vercel/project.json

      - name: Deploy isolated Preview
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          # No --prod flag is allowed here: this workflow must create Preview only.
          vercel deploy --yes --archive=tgz --token="$VERCEL_TOKEN"
