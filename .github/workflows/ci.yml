name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Public-repo hosted runner; pinned browsers avoid intermittent Ubuntu mirror downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, unit/security tests, and production build
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Browser E2E smoke tests
        run: npx playwright test

      - name: Synthetic patient registration browser QA (local mock only)
        run: npx playwright test --config=playwright.patient-registration-qa.config.mjs

      - name: Live public Atlas browser journeys (read-only Chromium)
        env:
          ATLAS_PRODUCTION_URL: https://atlasclinic.dpdns.org
        run: npx playwright test --config=playwright.production.config.mjs --project=desktop-chromium --grep 'live public|all four production|production version|signed-out clinic'

      - name: Live public Atlas browser journeys (read-only WebKit iPhone/iPad)
        env:
          ATLAS_PRODUCTION_URL: https://atlasclinic.dpdns.org
        run: npx playwright test --config=playwright.production.config.mjs --project=iphone-webkit --project=ipad-webkit --grep 'live public|all four production|production version|signed-out clinic'

  # Disposable PostgreSQL 17 database, synthetic clinics/users only.
  # No Atlas secrets, no Supabase project, no production SQL operations.
  doctor-workflow-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_acl_synthetic
          POSTGRES_PASSWORD: atlas_ci_synthetic_only
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_acl_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isolated two-clinic PostgreSQL authorization tests
        run: |
          python3 -c 'from pathlib import Path; f = Path("tests/security-doctor-workflow-isolation.sql").read_text(); marker = r"\i docs/security/doctor-workflow-grants-proposal-20261026.sql"; assert f.count(marker) == 1; print(f.replace(marker, Path("docs/security/doctor-workflow-grants-proposal-20261026.sql").read_text()))' \
            | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d atlas_acl_synthetic -v ON_ERROR_STOP=1
