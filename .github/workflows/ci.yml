name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, unit/security tests, and production build
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Browser E2E smoke tests
        run: npx playwright test

      - name: Live public Atlas browser journeys (read-only Chromium)
        env:
          ATLAS_PRODUCTION_URL: https://atlasclinic.dpdns.org
        run: npx playwright test --config=playwright.production.config.mjs --project=desktop-chromium --grep 'live public|all four production|production version'
