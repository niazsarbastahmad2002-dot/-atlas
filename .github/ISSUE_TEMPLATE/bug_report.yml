name: Bug report
description: Report a reproducible Atlas defect using synthetic or non-sensitive information.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Atlas. Do not include patient data, production credentials, access tokens, private keys, or other sensitive information. Security vulnerabilities should be reported privately according to SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device/browser/OS and relevant app context.
      placeholder: "Example: iPhone Safari, iPad Safari, desktop Chrome"
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Screenshots, logs, or other evidence with private information removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed patient data, credentials, tokens, and other sensitive information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
